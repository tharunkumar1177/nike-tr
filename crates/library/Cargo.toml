[package]
name = "tron-library"
description = "Component library index for Tron: built from the KiCad libraries, then searched"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "tron_library"

[[bin]]
name = "build-index"
path = "src/bin/build_index.rs"

[[bin]]
name = "search-benchmark"
path = "src/bin/search_benchmark.rs"

[dependencies]
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tron-core = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
