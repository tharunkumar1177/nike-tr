name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NODE_VERSION: "24.21.0"
  CARGO_TERM_COLOR: always
  NGSPICE_URL: https://downloads.sourceforge.net/project/ngspice/ng-spice-rework/old-releases/46/ngspice-46_dll_64.7z
  NGSPICE_SHA256: 5c03f25709d6ea7d1e58a82ebe7c1e6eb5177f266787466bf0c716791ba26e4c
  NGSPICE_COPYING_URL: https://sourceforge.net/p/ngspice/ngspice/ci/ngspice-46/tree/COPYING?format=raw
  NGSPICE_COPYING_SHA256: 53e838832e7c00598bb86602a99f9644ba2060e19be209b52e60adb2c8eb6f77
  LIBOMP_LICENSE_URL: https://raw.githubusercontent.com/llvm/llvm-project/llvmorg-15.0.7/openmp/LICENSE.TXT
  LIBOMP_LICENSE_SHA256: ""

jobs:
  lockfiles:
    name: Resolve lockfiles
    runs-on: ubuntu-latest
    outputs:
      generated: ${{ steps.check.outputs.generated }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate missing or stale lockfiles
        id: check
        run: |
          generated=false
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            generated=true
          fi
          if [ ! -f Cargo.lock ]; then
            cargo generate-lockfile
            generated=true
          elif ! cargo metadata --locked --format-version 1 > /dev/null; then
            echo "::warning::Cargo.lock does not match the manifests. Resolving only the changed dependencies."
            cargo update --workspace
            generated=true
          fi
          echo "generated=$generated" >> "$GITHUB_OUTPUT"

      - name: Upload generated lockfiles
        if: steps.check.outputs.generated == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: lockfiles
          path: |
            Cargo.lock
            package-lock.json
          if-no-files-found: error

  lockfiles-committed:
    name: Committed lockfiles
    needs: lockfiles
    if: needs.lockfiles.outputs.generated == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require the generated lockfiles to be committed
        run: |
          echo "::error::This run used lockfiles generated in CI. Commit Cargo.lock and package-lock.json from the lockfiles artifact."
          exit 1

  web:
    name: Web checks
    needs: lockfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use generated lockfiles
        if: needs.lockfiles.outputs.generated == 'true'
        uses: actions/download-artifact@v8
        with:
          name: lockfiles

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          if ! npm run format:check; then
            npx prettier --write . > /dev/null
            git --no-pager diff
            git checkout -- .
            exit 1
          fi

      - name: Type-check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

      - name: Build frontend
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

  rust:
    name: Rust checks
    needs: lockfiles
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use generated lockfiles
        if: needs.lockfiles.outputs.generated == 'true'
        uses: actions/download-artifact@v8
        with:
          name: lockfiles

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: checks

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend assets
        run: npm run build

      - name: Generate app icons
        id: icons
        run: npx tauri icon app-icon.svg

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        if: ${{ !cancelled() && steps.icons.outcome == 'success' }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Download ngspice
        id: ngspice
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
            --output "$RUNNER_TEMP/ngspice.7z" "$NGSPICE_URL"
          actual="$(sha256sum < "$RUNNER_TEMP/ngspice.7z" | cut -d ' ' -f 1)"
          echo "ngspice archive SHA-256: $actual"
          if [ "$actual" != "$NGSPICE_SHA256" ]; then
            7z l "$RUNNER_TEMP/ngspice.7z"
            echo "::error::The ngspice archive's SHA-256 is $actual, not the pinned NGSPICE_SHA256."
            exit 1
          fi
          7z x -y -o"$RUNNER_TEMP/ngspice" "$RUNNER_TEMP/ngspice.7z" > /dev/null
          dll="$RUNNER_TEMP/ngspice/Spice64_dll/dll-vs/ngspice.dll"
          if [ ! -f "$dll" ]; then
            find "$RUNNER_TEMP/ngspice" -maxdepth 3
            echo "::error::ngspice.dll is not at Spice64_dll/dll-vs in the archive."
            exit 1
          fi
          vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          dumpbin="$("$vswhere" -latest -find 'VC/Tools/MSVC/**/bin/Hostx64/x64/dumpbin.exe' | head -n 1 | tr -d '\r')"
          missing=""
          for module in "$(dirname "$dll")"/*.dll; do
            echo "Imports of $(basename "$module"):"
            imports="$(MSYS_NO_PATHCONV=1 "$dumpbin" /nologo /dependents "$(cygpath --windows "$module")" \
              | tr -d '\r' | grep -iE '^ +[^ ]+\.dll$' | tr -d ' ')"
            echo "$imports"
            for import in $imports; do
              case "${import,,}" in api-ms-win-*|ext-ms-*) continue ;; esac
              if [ ! -f "$(dirname "$dll")/$import" ] && [ ! -f "/c/Windows/System32/$import" ]; then
                missing="$missing $import"
              fi
            done
          done
          if [ -n "$missing" ]; then
            echo "::error::ngspice needs DLLs this runner lacks:$missing"
            exit 1
          fi
          echo "TRON_NGSPICE=$(cygpath --windows "$dll")" >> "$GITHUB_ENV"
          cygpath --windows "$(dirname "$dll")" >> "$GITHUB_PATH"

      - name: Test
        if: ${{ !cancelled() && steps.icons.outcome == 'success' && steps.ngspice.outcome == 'success' }}
        run: cargo test --workspace --locked --no-fail-fast

      - name: Check generated IPC bindings
        id: bindings
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          changes="$(git status --porcelain -- ui/src/bindings)"
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff -- ui/src/bindings
            echo "::error::Generated IPC bindings differ from the committed files. Commit the ipc-bindings artifact."
            exit 1
          fi

      - name: Upload regenerated IPC bindings
        if: failure() && steps.bindings.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: ipc-bindings
          path: ui/src/bindings

  bundle:
    name: Windows installer
    needs: [lockfiles, web, rust]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use generated lockfiles
        if: needs.lockfiles.outputs.generated == 'true'
        uses: actions/download-artifact@v8
        with:
          name: lockfiles

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate app icons
        run: npx tauri icon app-icon.svg

      - name: Stage ngspice resources
        shell: bash
        run: |
          mismatched=false
          fetch() {
            curl --fail --location --silent --show-error --retry 5 --retry-all-errors --output "$2" "$1"
            actual="$(sha256sum < "$2" | cut -d ' ' -f 1)"
            echo "SHA-256 of $1: $actual"
            if [ "$actual" != "$3" ]; then
              head -c 300 "$2"; echo
              echo "::error::$1 has SHA-256 $actual, not the pinned $4."
              mismatched=true
            fi
          }
          fetch "$NGSPICE_URL" "$RUNNER_TEMP/ngspice.7z" "$NGSPICE_SHA256" NGSPICE_SHA256
          fetch "$NGSPICE_COPYING_URL" "$RUNNER_TEMP/COPYING" "$NGSPICE_COPYING_SHA256" NGSPICE_COPYING_SHA256
          fetch "$LIBOMP_LICENSE_URL" "$RUNNER_TEMP/LICENSE-libomp.txt" "$LIBOMP_LICENSE_SHA256" LIBOMP_LICENSE_SHA256
          if [ "$mismatched" = true ]; then
            exit 1
          fi
          if ! grep -q "Redistribution and use" "$RUNNER_TEMP/COPYING"; then
            echo "::error::The ngspice COPYING download is not the BSD license text."
            exit 1
          fi
          if ! grep -q "Apache License" "$RUNNER_TEMP/LICENSE-libomp.txt"; then
            echo "::error::The libomp license download is not the Apache license text."
            exit 1
          fi
          7z x -y -o"$RUNNER_TEMP/ngspice" "$RUNNER_TEMP/ngspice.7z" > /dev/null
          archive="$RUNNER_TEMP/ngspice/Spice64_dll"
          staged=src-tauri/resources/ngspice
          mkdir -p "$staged/codemodels"
          cp "$archive/dll-vs/ngspice.dll" "$archive/dll-vs/libomp140.x86_64.dll" "$staged/"
          cp "$archive"/lib/ngspice/*.cm "$staged/codemodels/"
          cp "$RUNNER_TEMP/COPYING" "$RUNNER_TEMP/LICENSE-libomp.txt" "$staged/"
          find "$staged" -type f

      - name: Build installers
        run: npx tauri build --ci --config src-tauri/tauri.bundle.conf.json -- --locked

      - name: Check bundled ngspice
        shell: bash
        run: |
          for file in ngspice.dll libomp140.x86_64.dll COPYING LICENSE-libomp.txt codemodels/analog.cm; do
            if [ ! -f "target/release/ngspice/$file" ]; then
              find target/release -maxdepth 3 -path '*ngspice*'
              echo "::error::The build did not place ngspice/$file beside the app."
              exit 1
            fi
          done

      - name: Upload Windows installers
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [lockfiles, bundle]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.lockfiles.outputs.generated == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download Windows installers
        uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: installers

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version src-tauri/tauri.conf.json)"
          tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          mapfile -t files < <(find installers -type f \( -name '*.exe' -o -name '*.msi' \))
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No installers found in the windows-installer artifact."
            exit 1
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --target "$GITHUB_SHA" \
              --title "Tron ${version} (build ${GITHUB_RUN_NUMBER})" \
              --generate-notes \
              --latest
          fi
