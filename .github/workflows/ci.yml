name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NODE_VERSION: "24.21.0"
  CARGO_TERM_COLOR: always

jobs:
  lockfiles:
    name: Resolve lockfiles
    runs-on: ubuntu-latest
    outputs:
      generated: ${{ steps.check.outputs.generated }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate missing or stale lockfiles
        id: check
        run: |
          generated=false
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            generated=true
          fi
          if [ ! -f Cargo.lock ]; then
            cargo generate-lockfile
            generated=true
          elif ! cargo metadata --locked --format-version 1 > /dev/null; then
            echo "::warning::Cargo.lock does not match the manifests. Resolving only the changed dependencies."
            cargo update --workspace
            generated=true
          fi
          echo "generated=$generated" >> "$GITHUB_OUTPUT"

      - name: Upload generated lockfiles
        if: steps.check.outputs.generated == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: lockfiles
          path: |
            Cargo.lock
            package-lock.json
          if-no-files-found: error

  lockfiles-committed:
    name: Committed lockfiles
    needs: lockfiles
    if: needs.lockfiles.outputs.generated == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require the generated lockfiles to be committed
        run: |
          echo "::error::This run used lockfiles generated in CI. Commit Cargo.lock and package-lock.json from the lockfiles artifact."
          exit 1

  web:
    name: Web checks
    needs: lockfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use generated lockfiles
        if: needs.lockfiles.outputs.generated == 'true'
        uses: actions/download-artifact@v8
        with:
          name: lockfiles

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          if ! npm run format:check; then
            npx prettier --write . > /dev/null
            git --no-pager diff
            git checkout -- .
            exit 1
          fi

      - name: Type-check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

      - name: Build frontend
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

  rust:
    name: Rust checks
    needs: lockfiles
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use generated lockfiles
        if: needs.lockfiles.outputs.generated == 'true'
        uses: actions/download-artifact@v8
        with:
          name: lockfiles

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: checks

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend assets
        run: npm run build

      - name: Generate app icons
        id: icons
        run: npx tauri icon app-icon.svg

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        if: ${{ !cancelled() && steps.icons.outcome == 'success' }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        if: ${{ !cancelled() && steps.icons.outcome == 'success' }}
        run: cargo test --workspace --locked --no-fail-fast

      - name: Check generated IPC bindings
        id: bindings
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          changes="$(git status --porcelain -- ui/src/bindings)"
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff -- ui/src/bindings
            echo "::error::Generated IPC bindings differ from the committed files. Commit the ipc-bindings artifact."
            exit 1
          fi

      - name: Upload regenerated IPC bindings
        if: failure() && steps.bindings.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: ipc-bindings
          path: ui/src/bindings

  bundle:
    name: Windows installer
    needs: [lockfiles, web, rust]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use generated lockfiles
        if: needs.lockfiles.outputs.generated == 'true'
        uses: actions/download-artifact@v8
        with:
          name: lockfiles

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate app icons
        run: npx tauri icon app-icon.svg

      - name: Build installers
        run: npx tauri build --ci -- --locked

      - name: Upload Windows installers
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [lockfiles, bundle]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.lockfiles.outputs.generated == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download Windows installers
        uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: installers

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version src-tauri/tauri.conf.json)"
          tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          mapfile -t files < <(find installers -type f \( -name '*.exe' -o -name '*.msi' \))
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No installers found in the windows-installer artifact."
            exit 1
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --target "$GITHUB_SHA" \
              --title "Tron ${version} (build ${GITHUB_RUN_NUMBER})" \
              --generate-notes \
              --latest
          fi
