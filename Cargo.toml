[workspace]
resolver = "3"
members = ["crates/core", "crates/library", "crates/sim", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
flate2 = "1.1.10"
libloading = "0.8.8"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.11.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.12.2", features = [] }
tauri-build = { version = "2.7.1", features = [] }
tauri-plugin-dialog = "2.8.2"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["fs", "io-util", "macros", "rt", "sync"] }
tokio-util = { version = "0.7.19", default-features = false }
ts-rs = "12.0.1"
uuid = "1.28.0"
tron-core = { path = "crates/core" }
tron-library = { path = "crates/library" }
tron-sim = { path = "crates/sim" }
