[workspace]
resolver = "3"
members = ["crates/core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.12.2", features = [] }
tauri-build = { version = "2.7.1", features = [] }
tauri-plugin-dialog = "2.8.2"
tempfile = "3.27.0"
ts-rs = "12.0.1"
uuid = "1.28.0"
tron-core = { path = "crates/core" }
